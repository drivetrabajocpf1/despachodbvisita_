<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Despacho BD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f5f4f1;
        --surface: #ffffff;
        --border: #e2e0da;
        --border-md: #cccac2;
        --text: #1a1916;
        --muted: #7a7870;
        --faint: #b0ada4;
        --accent: #1a1916;
        --accent-fg: #f5f4f1;
        --tag-bg: #eef3ff;
        --tag-text: #2d4baa;
        --tag-bg2: #f0fdf4;
        --tag-text2: #166534;
        --danger: #c0392b;
        --danger-bg: #fff5f5;
        --success: #1a7a4a;
        --success-bg: #f0faf5;
        --radius: 10px;
        --radius-lg: 14px;
        --shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
        --shadow-md: 0 4px 16px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
      }

      *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

      body {
        font-family:"DM Sans",sans-serif;
        font-size:14px;
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        -webkit-font-smoothing:antialiased;
      }

      /* ── Layout ── */
      .layout { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }

      /* ── Sidebar ── */
      .sidebar {
        background:var(--surface);
        border-right:1px solid var(--border);
        display:flex;
        flex-direction:column;
        position:sticky;
        top:0;
        height:100vh;
        overflow-y:auto;
      }
      .sidebar-header { padding:28px 24px 20px; border-bottom:1px solid var(--border); }
      .logo { font-size:15px; font-weight:500; letter-spacing:-.01em; color:var(--text); display:flex; align-items:center; gap:9px; }
      .logo-icon { width:30px; height:30px; background:var(--text); border-radius:8px; display:flex; align-items:center; justify-content:center; }
      .logo-icon svg { color:var(--accent-fg); }
      .sidebar-section { padding:20px 16px 12px; }
      .sidebar-label { font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:0 8px; margin-bottom:6px; }
      .nav-item {
        display:flex; align-items:center; gap:9px; padding:8px 10px;
        border-radius:8px; font-size:13.5px; color:var(--muted);
        cursor:pointer; transition:background .12s,color .12s;
        border:none; background:none; width:100%; text-align:left; font-family:inherit;
      }
      .nav-item:hover { background:var(--bg); color:var(--text); }
      .nav-item.active { background:var(--bg); color:var(--text); font-weight:500; }
      .nav-item svg { flex-shrink:0; opacity:.7; }
      .nav-item.active svg { opacity:1; }
      .sidebar-footer { margin-top:auto; padding:16px; border-top:1px solid var(--border); }
      .user-pill { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:var(--bg); }
      .avatar { width:28px; height:28px; border-radius:50%; background:var(--text); color:var(--accent-fg); font-size:11px; font-weight:500; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:"DM Mono",monospace; }
      .user-info { flex:1; min-width:0; }
      .user-email { font-size:12px; color:var(--text); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .user-status { font-size:11px; color:var(--muted); }
      .btn-logout { background:none; border:none; cursor:pointer; color:var(--faint); padding:4px; border-radius:6px; display:flex; align-items:center; transition:color .12s,background .12s; }
      .btn-logout:hover { color:var(--danger); background:var(--danger-bg); }

      /* ── Main ── */
      .main { display:flex; flex-direction:column; min-height:100vh; }
      .topbar {
        padding:18px 32px; border-bottom:1px solid var(--border);
        display:flex; align-items:center; justify-content:space-between;
        background:var(--surface); position:sticky; top:0; z-index:10;
      }
      .page-title { font-size:16px; font-weight:500; letter-spacing:-.01em; }
      .page-sub { font-size:13px; color:var(--muted); margin-top:1px; }

      /* ── Panels ── */
      .panel { display:none; flex-direction:column; gap:0; flex:1; }
      .panel.active { display:flex; }

      /* ── Login ── */
      .login-wrap { display:flex; align-items:center; justify-content:center; flex:1; padding:40px; min-height:100vh; }
      .login-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:40px; width:100%; max-width:400px; box-shadow:var(--shadow-md); }
      .login-title { font-size:22px; font-weight:500; letter-spacing:-.02em; margin-bottom:6px; }
      .login-sub { font-size:13px; color:var(--muted); margin-bottom:28px; }

      /* ── Forms ── */
      .form-section { padding:28px 32px; border-bottom:1px solid var(--border); background:var(--surface); }
      .form-grid { display:grid; gap:14px; }
      .form-grid-2 { grid-template-columns:1fr 1fr; }
      .form-grid-3 { grid-template-columns:1fr 1fr 1fr; }
      .form-grid-4 { grid-template-columns:1fr 1fr 1fr 1fr; }
      .col-2 { grid-column:span 2; }
      .col-3 { grid-column:span 3; }
      .col-4 { grid-column:span 4; }
      .field { display:flex; flex-direction:column; gap:5px; }
      label { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.01em; }
      input,textarea,select {
        font-family:"DM Sans",sans-serif; font-size:14px; padding:9px 12px;
        border:1px solid var(--border); border-radius:var(--radius);
        background:var(--surface); color:var(--text); width:100%;
        outline:none; transition:border-color .15s,box-shadow .15s; -webkit-appearance:none;
      }
      input:hover,textarea:hover,select:hover { border-color:var(--border-md); }
      input:focus,textarea:focus,select:focus { border-color:var(--text); box-shadow:0 0 0 3px rgba(26,25,22,.08); }
      input::placeholder,textarea::placeholder { color:var(--faint); }
      textarea { resize:vertical; min-height:80px; line-height:1.55; }
      input[type="date"] { font-family:"DM Mono",monospace; font-size:13px; color:var(--text); }
      .form-actions { display:flex; gap:8px; margin-top:16px; align-items:center; }

      /* ── Buttons ── */
      .btn {
        font-family:"DM Sans",sans-serif; font-size:13.5px; font-weight:500;
        padding:9px 18px; border-radius:var(--radius); border:1px solid var(--border);
        cursor:pointer; transition:background .12s,border-color .12s,opacity .12s,transform .08s;
        display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
        background:var(--surface); color:var(--text); line-height:1;
      }
      .btn:hover { background:var(--bg); border-color:var(--border-md); }
      .btn:active { transform:scale(.98); }
      .btn-primary { background:var(--text); color:var(--accent-fg); border-color:var(--text); }
      .btn-primary:hover { opacity:.85; background:var(--text); }
      .btn-ghost { border-color:transparent; background:transparent; color:var(--muted); }
      .btn-ghost:hover { background:var(--bg); color:var(--text); border-color:transparent; }
      .btn-danger-soft { border-color:transparent; background:transparent; color:var(--danger); font-size:12px; padding:6px 10px; }
      .btn-danger-soft:hover { background:var(--danger-bg); border-color:transparent; }
      .btn-edit-soft { border-color:transparent; background:transparent; color:var(--muted); font-size:12px; padding:6px 10px; }
      .btn-edit-soft:hover { background:var(--bg); color:var(--text); border-color:transparent; }
      .btn-sm { padding:6px 12px; font-size:12px; }

      .btn-excel {
        background:#1a7a4a; color:#fff; border-color:#1a7a4a;
        font-size:12.5px; padding:8px 14px;
      }
      .btn-excel:hover { opacity:.88; background:#1a7a4a; }
      .btn-excel svg { flex-shrink:0; }

      /* ── Filter bar ── */
      .filter-bar {
        padding:16px 32px; border-bottom:1px solid var(--border);
        background:var(--bg); display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;
      }
      .filter-bar .field { flex:1; min-width:120px; }
      .filter-bar input,.filter-bar select { background:var(--surface); font-size:13px; padding:8px 11px; }

      /* ── Stats bar ── */
      .stats-bar { padding:16px 32px; display:flex; gap:24px; background:var(--bg); border-bottom:1px solid var(--border); flex-wrap:wrap; }
      .stat-item { display:flex; flex-direction:column; gap:2px; }
      .stat-num { font-size:20px; font-weight:500; letter-spacing:-.02em; font-family:"DM Mono",monospace; }
      .stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:500; }
      .stat-divider { width:1px; background:var(--border); align-self:stretch; }

      /* ── Results ── */
      .results-wrap { flex:1; padding:24px 32px; background:var(--bg); }
      .results-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
      .results-count { font-size:12px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.06em; }

      /* ── Cards expedientes ── */
      .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:8px; transition:border-color .15s,box-shadow .15s; position:relative; }
      .card:hover { border-color:var(--border-md); box-shadow:var(--shadow); }
      .card-inner { display:flex; gap:16px; align-items:flex-start; }
      .card-index { font-family:"DM Mono",monospace; font-size:11px; color:var(--faint); padding-top:2px; flex-shrink:0; min-width:28px; }
      .card-body { flex:1; min-width:0; }
      .card-head { display:flex; align-items:baseline; gap:10px; margin-bottom:5px; flex-wrap:wrap; }
      .card-num { font-size:14px; font-weight:500; font-family:"DM Mono",monospace; letter-spacing:-.01em; color:var(--text); }
      .card-detalle { font-size:13.5px; color:var(--muted); line-height:1.55; margin-bottom:10px; }
      .card-chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
      .chip { font-size:11.5px; padding:3px 9px; border-radius:20px; font-weight:500; border:1px solid var(--border); color:var(--muted); background:var(--bg); font-family:"DM Mono",monospace; letter-spacing:-.01em; }
      .chip-tag { background:var(--tag-bg); color:var(--tag-text); border-color:transparent; }
      .chip-green { background:var(--tag-bg2); color:var(--tag-text2); border-color:transparent; }
      .chip-fecha { color:var(--faint); border-color:transparent; background:transparent; font-size:11px; }
      .card-actions { display:flex; gap:2px; flex-shrink:0; opacity:0; transition:opacity .15s; align-items:flex-start; }

      .card:hover .card-actions,
      .personal-card:hover .card-actions { opacity:1; }

      /* ── Cards personal ── */
      .personal-card {
        background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
        padding:18px 20px; margin-bottom:8px; transition:border-color .15s,box-shadow .15s;
      }
      .personal-card:hover { border-color:var(--border-md); box-shadow:var(--shadow); }
      .personal-card-inner { display:flex; gap:16px; align-items:flex-start; }
      .personal-avatar {
        width:38px; height:38px; border-radius:50%; background:var(--bg); border:1px solid var(--border);
        display:flex; align-items:center; justify-content:center; flex-shrink:0;
        font-family:"DM Mono",monospace; font-size:13px; font-weight:500; color:var(--muted);
      }
      .personal-body { flex:1; min-width:0; }
      .personal-name { font-size:14.5px; font-weight:500; letter-spacing:-.01em; margin-bottom:3px; }
      .personal-sub { font-size:12.5px; color:var(--muted); margin-bottom:10px; }
      .personal-grid {
        display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
        gap:6px 16px; margin-bottom:10px;
      }
      .personal-field { display:flex; flex-direction:column; gap:1px; }
      .personal-field-label { font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; font-weight:500; }
      .personal-field-value { font-size:12.5px; color:var(--text); font-family:"DM Mono",monospace; }

      /* ── Ordenar tabs ── */
      .sort-tabs { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
      .sort-btn {
        font-family:"DM Sans",sans-serif; font-size:12px; font-weight:500;
        padding:5px 12px; border-radius:20px; border:1px solid var(--border);
        background:var(--surface); color:var(--muted); cursor:pointer;
        transition:background .12s,color .12s,border-color .12s;
        display:inline-flex; align-items:center; gap:4px;
      }
      .sort-btn:hover { background:var(--bg); color:var(--text); }
      .sort-btn.active { background:var(--text); color:var(--accent-fg); border-color:var(--text); }
      .sort-arrow { font-size:10px; opacity:.7; }

      /* ── Pagination ── */
      .pagination {
        display:flex; align-items:center; justify-content:space-between;
        padding:20px 0 4px; gap:12px; flex-wrap:wrap;
      }
      .pagination-info { font-size:12px; color:var(--muted); font-family:"DM Mono",monospace; }
      .pagination-controls { display:flex; gap:4px; align-items:center; }
      .page-btn {
        font-family:"DM Mono",monospace; font-size:12px; padding:6px 10px;
        border-radius:8px; border:1px solid var(--border); background:var(--surface);
        color:var(--muted); cursor:pointer; transition:background .12s,color .12s,border-color .12s;
        min-width:34px; text-align:center; display:flex; align-items:center; justify-content:center;
      }
      .page-btn:hover:not(:disabled) { background:var(--bg); color:var(--text); border-color:var(--border-md); }
      .page-btn.active { background:var(--text); color:var(--accent-fg); border-color:var(--text); }
      .page-btn:disabled { opacity:.35; cursor:not-allowed; }

      /* ── Empty state ── */
      .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:var(--faint); gap:10px; }
      .empty-state svg { opacity:.35; }
      .empty-state p { font-size:14px; }

      /* ── Modal ── */
      .overlay { position:fixed; inset:0; background:rgba(10,10,8,.45); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(2px); }
      .overlay.open { display:flex; }
      .modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; width:100%; max-width:600px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-md); animation:slideUp .18s ease; }
      @keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
      .modal-title { font-size:16px; font-weight:500; letter-spacing:-.01em; }
      .modal-close { background:none; border:none; cursor:pointer; color:var(--faint); padding:4px; border-radius:6px; transition:color .12s,background .12s; }
      .modal-close:hover { color:var(--text); background:var(--bg); }
      .modal-footer { display:flex; gap:8px; justify-content:flex-end; margin-top:24px; padding-top:20px; border-top:1px solid var(--border); }

      /* ── Dashboard ── */
      .dashboard-wrap { flex:1; padding:24px 32px; background:var(--bg); overflow-y:auto; }

      .dashboard-header {
        display:flex; align-items:center; justify-content:space-between; 
        margin-bottom:20px; flex-wrap:wrap; gap:12px;
      }

      .dashboard-filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

      .dashboard-select {
        font-family:"DM Sans",sans-serif; font-size:13px; padding:8px 32px 8px 12px;
        border:1px solid var(--border); border-radius:var(--radius);
        background:var(--surface); color:var(--text); cursor:pointer;
        outline:none; transition:border-color .15s; min-width:140px;
        background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M6 9L12 15L18 9' stroke='%237a7870' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 10px center;
        -webkit-appearance:none;
        -moz-appearance:none;
        appearance:none;
      }

      .dashboard-select:hover { border-color:var(--border-md); }
      .dashboard-select:focus { border-color:var(--text); box-shadow:0 0 0 3px rgba(26,25,22,.08); }

      .dashboard-cards {
        display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
        gap:12px; margin-bottom:24px;
      }

      .dashboard-card {
        background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
        padding:18px 20px; transition:border-color .15s,box-shadow .15s;
      }

      .dashboard-card:hover { border-color:var(--border-md); box-shadow:var(--shadow); }

      .dashboard-card-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:500; margin-bottom:6px; }

      .dashboard-card-value { font-size:28px; font-weight:500; letter-spacing:-.02em; font-family:"DM Mono",monospace; color:var(--text); line-height:1.1; }

      .dashboard-card-sub { font-size:11px; color:var(--faint); margin-top:4px; }

      .dashboard-summary {
        background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
        padding:20px; transition:border-color .15s,box-shadow .15s;
      }

      .dashboard-summary:hover { border-color:var(--border-md); box-shadow:var(--shadow); }

      .dashboard-summary-title { font-size:14px; font-weight:500; letter-spacing:-.01em; margin-bottom:14px; color:var(--text); }

      .dashboard-summary-grid {
        display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
        gap:12px;
      }

      .summary-item {
        padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius);
        background:var(--bg);
      }

      .summary-item-label { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:500; margin-bottom:4px; }

      .summary-item-value { font-size:14px; font-weight:500; font-family:"DM Mono",monospace; color:var(--text); }

      .dashboard-loading {
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        padding:40px; color:var(--muted); gap:12px;
      }

      .spinner {
        width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--text);
        border-radius:50%; animation:spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform:rotate(360deg); } }

      .dashboard-error {
        background:var(--danger-bg); border:1px solid #f5c6cb; color:var(--danger);
        padding:16px; border-radius:var(--radius); margin-bottom:16px;
        text-align:center; font-size:14px;
      }

      .dashboard-period-info {
        font-size:12px; color:var(--muted); font-weight:400;
      }

      /* ── Tablas del dashboard (reemplazan Chart.js) ── */
      .tabla-scroll { overflow-x:auto; margin-top:4px; }
      .tabla-simple { width:100%; border-collapse:collapse; font-size:13px; }
      .tabla-simple th,.tabla-simple td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); }
      .tabla-simple th { font-weight:500; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; background:var(--bg); }
      .tabla-simple td.num,.tabla-simple th.num { text-align:right; font-family:"DM Mono",monospace; }
      .tabla-simple tr:last-child td { border-bottom:none; }
      .tabla-simple tbody tr:hover td { background:var(--bg); }

      /* ── Responsive ── */
      @media (max-width:720px) {
        .layout { grid-template-columns:1fr; }
        .sidebar { position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); }
        .form-grid-2,.form-grid-3,.form-grid-4 { grid-template-columns:1fr; }
        .col-2,.col-3,.col-4 { grid-column:span 1; }
        .form-section,.results-wrap,.filter-bar,.stats-bar,.topbar,.dashboard-wrap { padding-left:16px; padding-right:16px; }
        .login-wrap { padding:20px; }
        .dashboard-cards { grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); }
      }
    </style>
  </head>

  <body>
    <!-- ── LOGIN ── -->
    <div id="loginWrap" class="login-wrap">
      <div class="login-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px">
          <div class="logo-icon">
            <svg width="16" height="16" fill="none" stroke="#f5f4f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <span style="font-size:15px;font-weight:500;letter-spacing:-.01em">Despacho db</span>
        </div>
        <div class="login-title">Iniciar sesión</div>
        <div class="login-sub">Ingresá mail y contraseña.</div>
        <div class="form-grid" style="gap:12px">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="usuario@ejemplo.com" autocomplete="email"/>
